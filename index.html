            landing.style.transform = 'translateY(-40px) scale(0.95)';
            landing.style.opacity = '0';
            
            setTimeout(() => {
                landing.style.display = 'none';
                arcade.style.display = 'block';
                
                setTimeout(() => {
                    arcade.style.opacity = '1';
                    loadHotGames();
                    loadGames();
                }, 50);
            }, 800);
        }

        function loadHotGames() {
            renderGrid(hotGamesList, 'hot-grid', 'hot');
        }

        function loadGames() {
            renderGrid(gamesList, 'main-grid', 'main');
        }

        function renderGrid(list, elementId, type) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            list.forEach((game, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.style.animation = `fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.1 + 0.1}s forwards`;
                
                // Fallback contrast logic for custom badge colors
                let badgeStyle = '';
                if (game.badgeText) {
                    const bg = game.badgeColor || 'var(--accent-primary)';
                    const color = getContrastYIQ(bg) === 'black' ? '#000' : '#fff';
                    badgeStyle = `background: ${bg}; color: ${color};`;
                }

                slot.innerHTML = `
                    <div class="thumbnail-area" onclick="playGame('${type}', ${index})" style="background-image: url('${game.img}')">
                        ${!game.img || game.img === 'image' ? '<span class="thumbnail-placeholder">?</span>' : ''}
                        ${game.badgeText ? `<span class="badge" style="${badgeStyle}">${game.badgeText}</span>` : ''}
                    </div>
                    <div class="slot-controls">
                        <h3 class="game-title" title="${game.title}">${game.title}</h3>
                        <button class="btn-play" onclick="playGame('${type}', ${index})">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            PLAY NOW
                        </button>
                    </div>
                `;
                grid.appendChild(slot);
            });
        }

        function getContrastYIQ(hexcolor){
            if(!hexcolor) return 'black';
            if(hexcolor.startsWith('var')) return 'black'; // fallback for css vars
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(x => x+x).join('');
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        function playGame(listType, index) {
            let data = listType === 'hot' ? hotGamesList[index] : gamesList[index];
            if (!data) return;
            
            document.getElementById('playing-title').innerText = data.title;
            const overlay = document.getElementById('fullscreen-overlay');
            const frame = document.getElementById('game-frame');
            
            overlay.style.display = 'flex';
            frame.src = data.url; 
            
            if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch((e) => {}); }
        }

        function closeGame() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
            document.getElementById('game-frame').src = ''; 
            if (document.exitFullscreen) { document.exitFullscreen().catch((e) => {}); }
        }
