<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriptCade</title>
  <style>
    /* Premium Minimalist Theme */
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --text-main: #ededed;
      --text-muted: #888888;
      --btn-bg: #ededed;
      --btn-text: #0a0a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* Clean Fade-in Entry */
    #app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem;
      opacity: 0;
      transform: translateY(10px);
      animation: entry 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes entry {
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      margin-bottom: 4rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
    }

    .username {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    /* Card Styling */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: #444;
    }

    .card-image-container {
      width: 100%;
      height: 180px;
      background-color: #1a1a1a;
      position: relative;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Minimal Badge */
    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: white;
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }

    .play-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 0.75rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      border-radius: 6px;
      transition: opacity 0.2s;
    }

    .play-btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <h1>Projects</h1>
      <div class="username">github.com/thenewscriptcade</div>
    </header>

    <main class="grid" id="game-grid"></main>
  </div>

  <script>
    // Your structured game data
    const games = [
      {
        title: "Doodle Glider",
        img: "Doodleglider.png", // Ensure this file is in your repo
        badgeText: "One Prompt",
        badgeColor: "#AF2B1E",
        url: "https://relthecreator.github.io/Doodle-Glider/"
      },
      {
        title: "Project Alpha",
        img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=800",
        badgeText: "In Dev",
        badgeColor: "#333333",
        url: "#"
      },
      {
        title: "Terminal Core",
        img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&q=80&w=800",
        badgeText: "Stable",
        badgeColor: "#222222",
        url: "#"
      }
    ];

    // Inject games into the grid
    const grid = document.getElementById('game-grid');
    
    grid.innerHTML = games.map(game => `
      <div class="card">
        <div class="card-image-container">
          ${game.badgeText ? `<span class="badge" style="background-color: ${game.badgeColor};">${game.badgeText}</span>` : ''}
          <!-- Uses an <img> tag for cleaner scaling -->
          <img src="${game.img}" alt="${game.title}" class="card-image" onerror="this.style.display='none'">
        </div>
        <div class="card-content">
          <h2 class="card-title">${game.title}</h2>
          <a href="${game.url}" class="play-btn" target="_blank">Open App</a>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
