<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCRIPT CADE | Monolith V3</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       1. CORE ARCHITECTURE & VARIABLES
       ========================================================================== */
    :root {
      --color-bg: #030303;
      --color-text: #fdfdfd;
      --color-muted: #666666;
      --color-accent: #ff3300; /* High-voltage industrial orange */
      --color-surface: #0a0a0a;
      
      --font-display: 'Syne', sans-serif;
      --font-ui: 'Inter', sans-serif;
      
      --ease-out: cubic-bezier(0.19, 1, 0.22, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      
      --spacing-sm: 2vw;
      --spacing-md: 5vw;
      --spacing-lg: 10vw;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html { font-size: 16px; background: var(--color-bg); overscroll-behavior: none; }

    body {
      color: var(--color-text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden; /* Scroll is handled by JS Lerp */
      cursor: none;
      user-select: none;
      background: var(--color-bg);
    }

    ::selection { background: var(--color-accent); color: var(--color-bg); }

    /* ==========================================================================
       2. CANVAS GRAIN & CUSTOM PHYSICS CURSOR
       ========================================================================== */
    #grain-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 9999; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
    }

    .cursor-dot, .cursor-follower {
      position: fixed; top: 0; left: 0;
      border-radius: 50%; z-index: 10000;
      pointer-events: none; transform: translate3d(-50%, -50%, 0);
    }

    .cursor-dot { width: 4px; height: 4px; background: var(--color-accent); }

    .cursor-follower {
      width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, 0.2);
      transition: width 0.4s var(--ease-out), height 0.4s var(--ease-out), 
                  background 0.4s var(--ease-out), border 0.4s var(--ease-out);
    }

    .cursor-follower.active {
      width: 100px; height: 100px;
      background: var(--color-text); border-color: transparent;
      mix-blend-mode: difference;
    }

    .cursor-follower.drag {
      width: 80px; height: 80px; border-color: var(--color-accent);
      background: rgba(255, 51, 0, 0.1); backdrop-filter: blur(4px);
    }
    
    /* Drag Text Indicator inside cursor */
    .cursor-follower::after {
      content: 'DRAG'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); font-size: 10px; font-weight: 700;
      letter-spacing: 2px; color: var(--color-accent); opacity: 0;
      transition: opacity 0.3s; font-family: var(--font-display);
    }
    
    .cursor-follower.drag::after { opacity: 1; }

    /* ==========================================================================
       3. SYSTEM PRELOADER
       ========================================================================== */
    #preloader {
      position: fixed; inset: 0; background: var(--color-bg); z-index: 9000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
    }

    #preloader.complete { transform: translateY(-100%); }

    .loader-counter {
      font-family: var(--font-display); font-size: 18vw; font-weight: 800;
      line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.1);
      position: relative;
    }

    .loader-counter::after {
      content: attr(data-count); position: absolute; top: 0; left: 0;
      color: var(--color-text); -webkit-text-stroke: 0; clip-path: inset(100% 0 0 0);
      animation: fillText 2.5s var(--ease-out) forwards;
    }

    @keyframes fillText { to { clip-path: inset(0 0 0 0); } }

    /* ==========================================================================
       4. GLOBAL NAVIGATION
       ========================================================================== */
    nav {
      position: fixed; top: 0; left: 0; width: 100%; padding: 2rem var(--spacing-md);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100; mix-blend-mode: difference;
    }

    .brand {
      font-family: var(--font-display); font-size: 1.5rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: -1px;
    }

    .nav-status {
      display: flex; gap: 2rem; font-size: 0.85rem; text-transform: uppercase;
      font-weight: 500; letter-spacing: 1px; color: var(--color-text);
    }

    .pulse {
      display: inline-block; width: 8px; height: 8px;
      background: var(--color-accent); border-radius: 50%;
      margin-right: 8px; box-shadow: 0 0 10px var(--color-accent);
      animation: blink 2s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ==========================================================================
       5. SMOOTH SCROLL CONTAINER
       ========================================================================== */
    #scroll-container {
      position: fixed; top: 0; left: 0; width: 100%;
      will-change: transform;
    }

    /* ==========================================================================
       6. HERO SECTION
       ========================================================================== */
    .hero {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: center; padding: 0 var(--spacing-md); position: relative;
    }

    .hero-title {
      font-family: var(--font-display); font-size: clamp(4rem, 12vw, 15rem);
      font-weight: 800; line-height: 0.85; text-transform: uppercase;
      margin-bottom: 2rem; letter-spacing: -0.04em;
    }

    /* Staggered text reveal */
    .char {
      display: inline-block; transform: translateY(120%) rotate(15deg);
      opacity: 0; transition: transform 1s var(--ease-out), opacity 1s;
    }
    
    body.ready .char { transform: translateY(0) rotate(0deg); opacity: 1; }

    .hero-subtitle {
      max-width: 500px; font-size: 1.1rem; color: var(--color-muted);
      line-height: 1.6; font-weight: 400; margin-left: auto;
      opacity: 0; transform: translateY(20px);
      transition: opacity 1s 1s, transform 1s 1s;
    }
    
    body.ready .hero-subtitle { opacity: 1; transform: translateY(0); }

    /* ==========================================================================
       7. HORIZONTAL SCROLL HIJACK (THE NEW LAYOUT)
       ========================================================================== */
    /* This container forces the body to have enough height to scroll */
    .horizontal-section {
      position: relative;
      height: 400vh; /* 4 screens worth of scrolling to view all horizontal cards */
      background: var(--color-bg);
    }

    .sticky-wrapper {
      position: sticky; top: 0; height: 100vh; width: 100%;
      overflow: hidden; display: flex; align-items: center;
    }

    /* The track that moves left and right */
    .horizontal-track {
      display: flex; gap: 8vw; padding: 0 var(--spacing-md);
      height: 70vh; will-change: transform;
    }

    /* Individual Game Cards */
    .game-card {
      position: relative; width: 65vw; min-width: 800px; height: 100%;
      flex-shrink: 0; display: block; text-decoration: none; color: var(--color-text);
      /* Clipping for premium image reveal */
      clip-path: inset(0 100% 0 0);
      transition: clip-path 1.5s var(--ease-out);
    }

    .game-card.in-view { clip-path: inset(0 0 0 0); }

    .game-image-wrapper {
      width: 100%; height: 100%; overflow: hidden; position: relative;
    }

    .game-image {
      width: 100%; height: 100%; object-fit: cover;
      transform: scale(1.2); filter: grayscale(100%) contrast(1.2);
      transition: transform 1s var(--ease-out), filter 0.8s;
      will-change: transform;
    }

    .game-card:hover .game-image { transform: scale(1); filter: grayscale(0%) contrast(1); }

    /* Massive background numbers */
    .game-index {
      position: absolute; top: -5%; right: -5%;
      font-family: var(--font-display); font-size: 30vw; font-weight: 800;
      color: rgba(255,255,255,0.03); line-height: 0.8; z-index: 0; pointer-events: none;
    }

    .game-info {
      position: absolute; bottom: 0; left: 0; width: 100%;
      padding: 3rem; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 10; display: flex; justify-content: space-between; align-items: flex-end;
    }

    .game-title {
      font-family: var(--font-display); font-size: 5rem; font-weight: 800;
      line-height: 1; text-transform: uppercase; margin-bottom: 1rem;
    }

    .game-tags { display: flex; gap: 1rem; }
    
    .game-tag {
      padding: 0.5rem 1rem; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px; font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 1px; backdrop-filter: blur(5px);
    }

    .launch-btn {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--color-accent); color: var(--color-bg);
      display: flex; justify-content: center; align-items: center;
      transition: transform 0.4s var(--ease-out);
    }

    .launch-btn svg { width: 30px; height: 30px; transition: transform 0.4s; }
    .game-card:hover .launch-btn { transform: scale(1.1); }
    .game-card:hover .launch-btn svg { transform: translateX(5px) rotate(45deg); }

    /* ==========================================================================
       8. OUTRO / FOOTER
       ========================================================================== */
    .outro {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      background: var(--color-surface); padding: 0 var(--spacing-md);
      position: relative; z-index: 2;
    }

    .outro-title {
      font-family: var(--font-display); font-size: clamp(3rem, 8vw, 10rem);
      font-weight: 800; text-transform: uppercase; color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.2); transition: color 0.4s;
    }

    .outro-title:hover { color: var(--color-text); -webkit-text-stroke: 0; }

    .footer-bar {
      position: absolute; bottom: 0; width: 100%; padding: 2rem var(--spacing-md);
      display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.85rem; color: var(--color-muted); text-transform: uppercase;
    }

    @media (max-width: 1024px) {
      .game-card { width: 85vw; min-width: 0; }
      .game-title { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <!-- Dynamic Noise Canvas -->
  <canvas id="grain-canvas"></canvas>

  <!-- Physics Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-follower"></div>

  <!-- Cinematic Preloader -->
  <div id="preloader">
    <div class="loader-counter" data-count="000">000</div>
  </div>

  <nav>
    <div class="brand hover-trigger">Scriptcade</div>
    <div class="nav-status">
      <div><span class="pulse"></span> System Active</div>
      <div>V 5.0</div>
    </div>
  </nav>

  <!-- Lerp Scroll Container -->
  <div id="scroll-container">
    
    <!-- SECTION 1: HERO -->
    <header class="hero">
      <h1 class="hero-title js-split-text">Scriptcade</h1>
      <h1 class="hero-title js-split-text" style="color: var(--color-muted);">Engine</h1>
      <p class="hero-subtitle">
        A curated horizontal archive of interactive digital modules, procedural logic, and kinematic engineering. Scroll to deploy.
      </p>
    </header>

    <!-- SECTION 2: HORIZONTAL SCROLL HIJACK -->
    <section class="horizontal-section" id="hz-section">
      <div class="sticky-wrapper">
        <div class="horizontal-track" id="hz-track">
          <!-- Game Cards Injected Here via JS -->
        </div>
      </div>
    </section>

    <!-- SECTION 3: OUTRO -->
    <section class="outro">
      <h2 class="outro-title hover-trigger">End Transmission</h2>
      <div class="footer-bar">
        <span>© 2026 Scriptcade Industries</span>
        <span>All Systems Operational</span>
      </div>
    </section>

  </div>

  <script>
    /**
     * ==========================================================================
     * 1. DATA CONFIGURATION & DOM INJECTION
     * ==========================================================================
     */
    const games = [
      {
        title: "Doodle Glider",
        tags: ["Physics", "One-Prompt", "Canvas"],
        img: "Doodleglider.png", 
        url: "https://relthecreator.github.io/Doodle-Glider/"
      },
      {
        title: "Neon Protocol",
        tags: ["Cybernetic", "Simulation", "WebGL"],
        img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1600",
        url: "#"
      },
      {
        title: "Terminal 04",
        tags: ["Logic Core", "Brutalist", "React"],
        img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1600",
        url: "#"
      },
      {
        title: "Echo Chamber",
        tags: ["Narrative", "A.I.", "Data"],
        img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1600",
        url: "#"
      }
    ];

    const track = document.getElementById('hz-track');
    
    track.innerHTML = games.map((game, index) => `
      <a href="${game.url}" class="game-card hz-drag-target" target="_blank">
        <div class="game-index">0${index + 1}</div>
        <div class="game-image-wrapper">
          <img src="${game.img}" alt="${game.title}" class="game-image parallax-img">
        </div>
        <div class="game-info">
          <div>
            <h2 class="game-title">${game.title}</h2>
            <div class="game-tags">
              ${game.tags.map(tag => `<span class="game-tag">${tag}</span>`).join('')}
            </div>
          </div>
          <div class="launch-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="square" stroke-linejoin="miter" d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </div>
        </div>
      </a>
    `).join('');

    // Split Text Logic for Hero
    document.querySelectorAll('.js-split-text').forEach(el => {
      const text = el.innerText;
      el.innerHTML = '';
      text.split('').forEach((char, i) => {
        const span = document.createElement('span');
        span.innerText = char === ' ' ? '\u00A0' : char;
        span.className = 'char';
        span.style.transitionDelay = `${(i * 0.03) + 1.2}s`; 
        el.appendChild(span);
      });
    });

    /**
     * ==========================================================================
     * 2. SYNTHETIC AUDIO ENGINE
     * ==========================================================================
     */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playHoverSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime); 
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime); 
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    /**
     * ==========================================================================
     * 3. SYSTEM PRELOADER
     * ==========================================================================
     */
    let loadCount = 0;
    const counterEl = document.querySelector('.loader-counter');
    const preloader = document.getElementById('preloader');
    
    const loadInterval = setInterval(() => {
      loadCount += Math.floor(Math.random() * 6) + 1;
      if (loadCount >= 100) {
        loadCount = 100;
        clearInterval(loadInterval);
        setTimeout(() => {
          preloader.classList.add('complete');
          document.body.classList.add('ready');
        }, 500);
      }
      const formatted = loadCount.toString().padStart(3, '0');
      counterEl.innerText = formatted;
      counterEl.setAttribute('data-count', formatted);
    }, 20);

    /**
     * ==========================================================================
     * 4. SMOOTH SCROLL & HORIZONTAL MATH (THE CORE ENGINE)
     * ==========================================================================
     */
    const scrollContainer = document.getElementById('scroll-container');
    const hzSection = document.getElementById('hz-section');
    const hzTrack = document.getElementById('hz-track');
    const cards = document.querySelectorAll('.game-card');
    
    let currentScroll = 0;
    let targetScroll = 0;
    let ease = 0.07; // Momentum weight
    
    // Calculate total body height based on the fixed scroll container
    function updateHeight() {
      document.body.style.height = `${scrollContainer.getBoundingClientRect().height}px`;
    }
    
    // We must wait a frame for DOM rendering before calculating height
    setTimeout(updateHeight, 100);
    window.addEventListener('resize', updateHeight);
    window.addEventListener('scroll', () => { targetScroll = window.scrollY; });

    function smoothScroll() {
      // Linear Interpolation (Lerp) for buttery scrolling
      currentScroll += (targetScroll - currentScroll) * ease;
      
      // Calculate Scroll Velocity for Skew Effects
      const velocity = targetScroll - currentScroll;
      const skew = velocity * 0.02;
      
      // 1. Move the main vertical container
      scrollContainer.style.transform = `translate3d(0, -${currentScroll.toFixed(2)}px, 0)`;

      // 2. HORIZONTAL SCROLL MATH
      const hzRect = hzSection.getBoundingClientRect();
      const scrollProgress = -hzRect.top / (hzRect.height - window.innerHeight);
      
      // Check if we are inside the horizontal section bounds
      if (scrollProgress >= 0 && scrollProgress <= 1) {
        // Calculate max scroll distance based on track width vs screen width
        const maxScroll = hzTrack.scrollWidth - window.innerWidth + (window.innerWidth * 0.1);
        const xMove = scrollProgress * maxScroll;
        
        // Apply transform: move track left, and apply velocity skew
        hzTrack.style.transform = `translate3d(-${xMove}px, 0, 0) skewX(${skew}deg)`;
        
        // Parallax inside the horizontal images
        document.querySelectorAll('.parallax-img').forEach(img => {
          img.style.transform = `translate3d(${xMove * 0.1}px, 0, 0) scale(1.2)`;
        });

        // Trigger reveal animations for cards when they enter screen
        cards.forEach(card => {
          const cardRect = card.getBoundingClientRect();
          if (cardRect.left < window.innerWidth * 0.8) {
            card.classList.add('in-view');
          }
        });
      }

      requestAnimationFrame(smoothScroll);
    }
    smoothScroll();

    /**
     * ==========================================================================
     * 5. PHYSICS CURSOR
     * ==========================================================================
     */
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorFollower = document.querySelector('.cursor-follower');
    let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
    let followerX = mouseX, followerY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      cursorDot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
    });

    function animateCursor() {
      followerX += (mouseX - followerX) * 0.2;
      followerY += (mouseY - followerY) * 0.2;
      cursorFollower.style.transform = `translate3d(${followerX}px, ${followerY}px, 0)`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Standard Hovers
    document.querySelectorAll('.hover-trigger').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursorFollower.classList.add('active');
        playHoverSound();
      });
      el.addEventListener('mouseleave', () => cursorFollower.classList.remove('active'));
    });

    // Custom "Drag" state for the horizontal cards
    document.querySelectorAll('.hz-drag-target').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursorFollower.classList.add('drag');
        playHoverSound();
      });
      el.addEventListener('mouseleave', () => cursorFollower.classList.remove('drag'));
    });

    /**
     * ==========================================================================
     * 6. HTML5 CANVAS FILM GRAIN
     * ==========================================================================
     */
    const canvas = document.getElementById('grain-canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let w, h, grainData;

    function initGrain() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      grainData = ctx.createImageData(w, h);
    }
    window.addEventListener('resize', initGrain);
    initGrain();

    function renderGrain() {
      const buffer = new Uint32Array(grainData.data.buffer);
      for (let i = 0; i < buffer.length; i++) {
        // High speed monochrome noise computation
        buffer[i] = Math.random() < 0.5 ? 0xFFFFFFFF : 0xFF000000;
      }
      ctx.putImageData(grainData, 0, 0);
      requestAnimationFrame(renderGrain);
    }
    renderGrain();

  </script>
</body>
</html>
