<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6853980997029870" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptCade</title> 
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');

        :root { 
            --bg-base: #0f1115; /* Clean dark background */
            --bg-surface: #1a1c23; /* Solid card background */
            --bg-surface-hover: #23252e;
            --accent-primary: #00e5ff; 
            --accent-secondary: #ff2a5f;
            --text-main: #f8f9fa;
            --text-muted: #a0a6b1;
            --border-color: #2a2d35;
        }

        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Outfit', system-ui, sans-serif; 
            margin: 0; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LANDING MENU */
        #landing-screen { 
            position: fixed; inset: 0; 
            background-color: var(--bg-base);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease;
        }

        .landing-content {
            text-align: center; 
            display: flex; flex-direction: column; align-items: center; gap: 30px;
        }
        
        .logo-placeholder {
            width: 350px; max-width: 80vw;
            object-fit: contain;
        }
        
        .enter-btn { 
            padding: 14px 40px; font-size: 1.1rem; font-weight: 700; letter-spacing: 2px;
            color: #000; background: var(--text-main); 
            border: none; border-radius: 6px; cursor: pointer; 
            transition: all 0.2s ease; text-transform: uppercase;
        }
        .enter-btn:hover { 
            background: var(--accent-primary);
            transform: translateY(-2px);
        }

        /* ARCADE CONTAINER */
        #arcade-container {
            padding: 50px 5%; max-width: 1200px; margin: 0 auto;
            display: none; 
            animation: fadeIn 0.8s ease forwards;
        }
        
        .app-title {
            text-align: center; font-size: 3rem; font-weight: 800; letter-spacing: 2px;
            margin: 0 0 50px 0; color: var(--text-main);
        }

        /* GRID & SLOTS */
        .section-title { 
            font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; 
            display: flex; align-items: center; gap: 10px; letter-spacing: 1px;
            text-transform: uppercase; color: var(--text-muted);
        }
        
        .game-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; margin-bottom: 60px; 
        }
        
        .slot { 
            background: var(--bg-surface); border-radius: 12px; overflow: hidden; 
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            display: flex; flex-direction: column;
            text-decoration: none; cursor: pointer;
        }
        .slot:hover { 
            transform: translateY(-5px); 
            background: var(--bg-surface-hover);
            border-color: #444955;
        }
        
        .thumbnail-area { 
            height: 160px; background: #000; background-size: cover; background-position: center; 
            position: relative; border-bottom: 1px solid var(--border-color);
        }
        
        .badge { 
            position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 4px; 
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .slot-controls { 
            padding: 15px; display: flex; flex-direction: column; gap: 12px; 
        }
        .game-title { 
            margin: 0; font-size: 1.1rem; font-weight: 600; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; color: var(--text-main); 
        }
        
        .btn-play { 
            background: #2a2d35; color: var(--text-main); 
            border: none; padding: 10px; border-radius: 6px; 
            cursor: pointer; font-weight: 600; font-size: 0.85rem; width: 100%; 
            transition: background 0.2s ease;
        }
        .slot:hover .btn-play { 
            background: var(--text-main); color: #000; 
        }

        /* FULLSCREEN overlay */
        #fullscreen-overlay { 
            display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; 
            background: var(--bg-base); z-index: 10000; flex-direction: column; 
        }
        #game-header { 
            height: 50px; background: #16181d; 
            display: flex; align-items: center; padding: 0 15px; 
            border-bottom: 1px solid var(--border-color); justify-content: space-between;
        }
        #back-btn { 
            background: transparent; color: var(--text-muted); 
            padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 4px; 
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            transition: all 0.2s;
        }
        #back-btn:hover { 
            background: var(--border-color); color: #fff; 
        }
        #playing-title { font-weight: 600; color: #fff; font-size: 0.9rem;}
        #game-frame { width: 100%; height: calc(100vh - 50px); border: none; background: #000; }

        @keyframes fadeIn { 
            0% { opacity: 0; } 
            100% { opacity: 1; } 
        }
    </style>
</head>
<body>

    <!-- LANDING MENU -->
    <div id="landing-screen">
        <div class="landing-content">
            <img id="logo-img" class="logo-placeholder" src="script.png" alt="ScriptCade Logo" onerror="this.style.display='none'; document.getElementById('text-logo').style.display='block';">
            <h1 id="text-logo" style="display:none; margin: 0; font-size: 3.5rem;">ScriptCade</h1>
            <button id="enter-btn" class="enter-btn" onclick="enterArcade()">Play Now</button>
        </div>
    </div>

    <!-- MAIN ARCADE -->
    <div id="arcade-container">
        <h1 class="app-title">ScriptCade</h1>
        
        <h2 class="section-title">
            <span style="color: var(--accent-secondary);">●</span> Hot Releases
        </h2>
        <div class="game-grid" id="hot-grid"></div>

        <h2 class="section-title" style="margin-top: 40px;">
            <span style="color: var(--accent-primary);">●</span> All Games
        </h2>
        <div class="game-grid" id="main-grid"></div>
    </div>

    <!-- FULLSCREEN GAME VIEW -->
    <div id="fullscreen-overlay">
        <div id="game-header">
            <button id="back-btn" onclick="closeGame()">← Back to Arcade</button>
            <span id="playing-title"></span>
            <div style="width: 100px;"></div>
        </div>
        <iframe id="game-frame" sandbox="allow-scripts allow-pointer-lock allow-same-origin allow-forms"></iframe>
    </div>

    <script>
        function enterArcade() {
            const landing = document.getElementById('landing-screen');
            const arcade = document.getElementById('arcade-container');
            landing.style.opacity = '0';
            setTimeout(() => {
                landing.style.display = 'none';
                arcade.style.display = 'block';
                loadHotGames();
                loadGames();
            }, 500);
        }

        function loadHotGames() { renderGrid(hotGamesList, 'hot-grid', 'hot'); }
        function loadGames() { renderGrid(gamesList, 'main-grid', 'main'); }

        function renderGrid(list, elementId, type) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            list.forEach((game, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                
                let badgeStyle = '';
                if (game.badgeText) {
                    const bg = game.badgeColor || 'var(--accent-primary)';
                    const color = getContrastYIQ(bg) === 'black' ? '#000' : '#fff';
                    badgeStyle = `background: ${bg}; color: ${color};`;
                }

                slot.innerHTML = `
                    <div class="thumbnail-area" onclick="playGame('${type}', ${index})" style="background-image: url('${game.img}')">
                        ${game.badgeText ? `<span class="badge" style="${badgeStyle}">${game.badgeText}</span>` : ''}
                    </div>
                    <div class="slot-controls">
                        <h3 class="game-title" title="${game.title}">${game.title}</h3>
                        <button class="btn-play" onclick="playGame('${type}', ${index})">Play</button>
                    </div>
                `;
                grid.appendChild(slot);
            });
        }

        function getContrastYIQ(hexcolor){
            if(!hexcolor) return 'black';
            if(hexcolor.startsWith('var')) return 'black'; 
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(x => x+x).join('');
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        function playGame(listType, index) {
            let data = listType === 'hot' ? hotGamesList[index] : gamesList[index];
            if (!data) return;
            document.getElementById('playing-title').innerText = data.title;
            document.getElementById('fullscreen-overlay').style.display = 'flex';
            document.getElementById('game-frame').src = data.url; 
        }

        function closeGame() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
            document.getElementById('game-frame').src = ''; 
        }

        const hotGamesList = [
            { title: "Blade Ball", img: "bladethumb.png", badgeText: "HOT", badgeColor: "#ff2a5f", url: "https://scriptcade.github.io/blade-ball/" },
            { title: "Geometry Dash Maker", img: "gdthumb.jpeg", badgeText: "HOT", badgeColor: "#ff2a5f", url: "https://scriptcade.github.io/this-is-a-tesst-changing-later/" },
            { title: "Grow A Garden", img: "GrowAGardenthumb.avif", badgeText: "HOT", badgeColor: "#ff2a5f", url: "https://scriptcade.github.io/grow-a-garden-gemini/" }
        ];

        const gamesList = [
            { title: "Among Us Clone", img: "amongusthumb.webp", badgeText: "FIRST PUBLISHED", badgeColor: "#00e5ff", url: "https://scriptcade.github.io/among-us-gemini/" },
            { title: "Epic Plane Evolution", img: "epicplanethumb.jpeg", url: "https://scriptcade.github.io/epic-plane-evolution/" },
            { title: "Block Blast", img: "blockthumb.jpeg", badgeText: "SAVES DATA", badgeColor: "#e0a800", url: "https://scriptcade.github.io/block-blast/" },
            { title: "Tower Defense Simulator", img: "tdsthumb.jpeg", url: "https://scriptcade.github.io/tds/" },
            { title: "Block Shooter", img: "BLOCK SHOOTER.png", badgeText: "NEW", badgeColor: "#00e5ff", url: "https://scriptcade.github.io/block-shooter/" },
            { title: "Doodle Glider", img: "Doodleglider.png", badgeText: "One Prompt", badgeColor: "#9c27b0", url: "https://relthecreator.github.io/Doodle-Glider/" }
        ];
    </script>
</body>
</html>
