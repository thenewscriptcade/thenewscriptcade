<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriptCade | Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-hover: #27272a;
      --border: #3f3f46;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #ffffff;
      --accent-bg: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* --- CLEAN LOADING SCREEN --- */
    #loader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg); z-index: 9999;
      display: flex; justify-content: center; align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- MAIN LAYOUT --- */
    #app {
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      max-width: 1200px; margin: 0 auto; padding: 3rem 2rem;
    }
    
    #app.ready { opacity: 1; transform: translateY(0); }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4rem;
    }

    .brand {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 0.5rem;
    }

    .brand-icon {
      width: 24px; height: 24px; background: var(--text-main); border-radius: 6px;
    }

    .header-tag {
      font-size: 0.875rem; font-weight: 600; color: var(--text-muted);
      background: var(--surface); padding: 0.4rem 0.8rem; border-radius: 20px;
    }

    .section-title {
      font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -1px;
    }
    
    .section-subtitle {
      color: var(--text-muted); margin-bottom: 3rem; font-size: 1.1rem;
    }

    /* --- GAME GRID --- */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.5rem;
      display: flex; flex-direction: column;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--surface-hover);
      border-color: #52525b;
    }

    .card-header { margin-bottom: 1rem; }
    
    .card-title {
      font-size: 1.25rem; font-weight: 600; color: var(--text-main);
      margin-bottom: 0.25rem; text-transform: capitalize;
    }

    .card-desc {
      font-size: 0.95rem; color: var(--text-muted); line-height: 1.5;
      flex-grow: 1; margin-bottom: 2rem;
    }

    .play-btn {
      display: inline-flex; justify-content: center; align-items: center;
      width: 100%; padding: 0.75rem;
      background: var(--text-main); color: var(--bg);
      text-decoration: none; border-radius: 8px;
      font-weight: 600; font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .play-btn:hover { opacity: 0.9; }
    
    .empty-state { color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 2rem; }
  </style>
</head>
<body>

  <!-- Clean Loader -->
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Main App -->
  <div id="app">
    <header>
      <div class="brand">
        <div class="brand-icon"></div>
        ScriptCade
      </div>
      <div class="header-tag">@thenewscriptcade</div>
    </header>

    <div>
      <h1 class="section-title">Your Library</h1>
      <p class="section-subtitle">Auto-synced directly from your GitHub repositories.</p>
    </div>

    <main class="grid" id="games-grid">
      <!-- Games will inject here -->
    </main>
  </div>

  <script>
    const GITHUB_USERNAME = 'thenewscriptcade';

    // Smooth loading sequence
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loader').style.opacity = '0';
        document.getElementById('loader').style.visibility = 'hidden';
        document.getElementById('app').classList.add('ready');
        fetchGames();
      }, 800); // Quick, snappy 0.8s load
    });

    // Import repos
    async function fetchGames() {
      const grid = document.getElementById('games-grid');
      
      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=12`);
        if (!response.ok) throw new Error('Network error');
        
        const repos = await response.json();
        grid.innerHTML = ''; 

        if (repos.length === 0) {
          grid.innerHTML = `<div class="empty-state">No repositories found. Push some code to see it here.</div>`;
          return;
        }

        repos.forEach(repo => {
          if (repo.name.toLowerCase() === `${GITHUB_USERNAME}.github.io`) return;

          const card = document.createElement('div');
          card.className = 'card';
          
          const cleanName = repo.name.replace(/[-_]/g, ' ');
          const desc = repo.description || 'No description provided for this project.';
          const playUrl = repo.has_pages ? `https://${GITHUB_USERNAME}.github.io/${repo.name}` : repo.html_url;

          card.innerHTML = `
            <div class="card-header">
              <h2 class="card-title">${cleanName}</h2>
            </div>
            <p class="card-desc">${desc}</p>
            <a href="${playUrl}" class="play-btn" target="_blank">Play Game</a>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        console.error('Error fetching repos:', error);
        grid.innerHTML = `<div class="empty-state">Could not connect to GitHub. Try again later.</div>`;
      }
    }
  </script>
</body>
</html>
