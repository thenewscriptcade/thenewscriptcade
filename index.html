<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6853980997029870" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptCade</title> 
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap');

        :root { 
            --bg-base: #0a0a0f; 
            --bg-surface: rgba(30, 30, 40, 0.4); 
            --bg-surface-hover: rgba(40, 40, 55, 0.6);
            --accent-primary: #00f0ff; 
            --accent-primary-dim: rgba(0, 240, 255, 0.2);
            --accent-secondary: #ff0055;
            --accent-secondary-dim: rgba(255, 0, 85, 0.2);
            --text-main: #ffffff;
            --text-muted: #94a1b2;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #1a1a24; border-radius: 10px; border: 2px solid var(--bg-base); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary-dim); border-color: var(--accent-primary); }

        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Outfit', system-ui, sans-serif; 
            margin: 0; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ANIMATED AMBIENT BACKGROUND */
        body::before, body::after {
            content: ''; position: fixed; width: 60vw; height: 60vw;
            border-radius: 50%; z-index: -1; filter: blur(100px);
            opacity: 0.15; animation: drift 15s infinite alternate ease-in-out;
            pointer-events: none;
        }
        body::before {
            background: radial-gradient(circle, var(--accent-primary) 0%, transparent 60%);
            top: -10%; left: -10%;
        }
        body::after {
            background: radial-gradient(circle, var(--accent-secondary) 0%, transparent 60%);
            bottom: -20%; right: -10%;
            animation-delay: -5s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        /* LANDING MENU */
        #landing-screen { 
            position: fixed; inset: 0; width: 100vw; height: 100vh; 
            background: radial-gradient(circle at center, #16161e 0%, var(--bg-base) 100%);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        /* 3D Grid Background for Landing Screen */
        #landing-screen::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(var(--glass-border) 1px, transparent 1px),
            linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 50px 50px; opacity: 0.2; z-index: -1;
            transform: perspective(600px) rotateX(60deg) translateY(-50px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        .landing-content {
            text-align: center; 
            display: flex; flex-direction: column; align-items: center; gap: 40px;
            animation: fadeUp 1s ease both;
        }
        
        .logo-placeholder {
            width: 400px; max-width: 80vw;
            filter: drop-shadow(0 0 30px var(--accent-primary-dim));
            object-fit: contain;
            transition: filter 0.3s ease;
        }
        .logo-placeholder:hover { filter: drop-shadow(0 0 40px rgba(0, 240, 255, 0.5)); }
        
        .enter-btn { 
            padding: 16px 56px; font-size: 1.2rem; font-weight: 900; letter-spacing: 3px;
            color: #000; background: var(--accent-primary); 
            border: none; border-radius: 8px; cursor: pointer; 
            box-shadow: 0 0 20px var(--accent-primary-dim), inset 0 0 10px rgba(255,255,255,0.4);
            transition: all 0.3s ease; text-transform: uppercase;
        }
        .enter-btn:hover { 
            transform: translateY(-5px) scale(1.05); 
            box-shadow: 0 15px 30px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(255,255,255,0.8);
            background: #ffffff;
        }

        /* ARCADE CONTAINER */
        #arcade-container {
            padding: 60px 5%; max-width: 1400px; margin: 0 auto;
            display: none; 
            animation: fadeIn 1s ease forwards;
        }
        
        .app-title {
            text-align: center; font-size: 4rem; font-weight: 900; letter-spacing: 6px;
            margin-bottom: 70px; text-transform: uppercase; margin-top: 0;
            background: linear-gradient(135deg, var(--accent-primary), #ffffff, var(--accent-secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0,240,255,0.3));
        }

        /* GRID & SLOTS */
        .section-title { 
            font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; 
            display: flex; align-items: center; gap: 15px; letter-spacing: 2px;
        }
        .section-title::after {
            content: ''; flex: 1; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, currentColor, transparent); opacity: 0.3;
        }
        
        .game-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; margin-bottom: 80px; 
        }
        
        .slot { 
            background: var(--bg-surface); border-radius: 16px; overflow: hidden; 
            border: 1px solid var(--glass-border); backdrop-filter: blur(12px);
            transition: all 0.4s ease;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: fadeUp 0.6s ease both;
        }
        .slot:hover { 
            transform: translateY(-8px); 
            border-color: var(--accent-primary-dim);
            background: var(--bg-surface-hover);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px var(--accent-primary-dim); 
        }
        
        .thumbnail-area { 
            height: 180px; background: #050505; background-size: cover; background-position: center; 
            position: relative; cursor: pointer; overflow: hidden;
        }
        .thumbnail-area::after {
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to bottom, transparent 30%, rgba(10,10,15,0.95) 100%);
        }
        .slot:hover .thumbnail-area { background-size: 110%; transition: background-size 0.5s ease; }
        
        .thumbnail-placeholder { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4em; font-weight: 900; color: rgba(255,255,255,0.1); 
        }
        
        .badge { 
            position: absolute; top: 12px; right: 12px; padding: 6px 14px; border-radius: 6px; 
            font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 2; 
        }
        
        .slot-controls { 
            padding: 20px; display: flex; flex-direction: column; gap: 15px; 
            position: relative; z-index: 2; flex-grow: 1; justify-content: space-between;
        }
        .game-title { 
            margin: 0; font-size: 1.3rem; font-weight: 800; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; color: var(--text-main); 
        }
        
        .btn-play { 
            background: rgba(255,255,255,0.05); color: var(--text-main); 
            border: 1px solid var(--glass-border); padding: 12px; border-radius: 8px; 
            cursor: pointer; font-weight: 800; letter-spacing: 1px; width: 100%; 
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .slot:hover .btn-play { 
            background: var(--accent-primary); color: #000; 
            border-color: var(--accent-primary); 
            box-shadow: 0 0 20px rgba(0,240,255,0.3); 
        }

        /* FULLSCREEN overlay */
        #fullscreen-overlay { 
            display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; 
            background: var(--bg-base); z-index: 10000; flex-direction: column; 
        }
        #game-header { 
            height: 60px; background: rgba(10,10,15,0.9); backdrop-filter: blur(15px);
            display: flex; align-items: center; padding: 0 20px; 
            border-bottom: 1px solid var(--glass-border); justify-content: space-between;
        }
        #back-btn { 
            background: rgba(255,0,85,0.1); color: var(--accent-secondary); 
            padding: 8px 20px; border: 1px solid rgba(255,0,85,0.3); border-radius: 6px; 
            cursor: pointer; font-weight: 800; font-size: 0.9rem; letter-spacing: 1px;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        #back-btn:hover { 
            background: var(--accent-secondary); color: #fff; 
            border-color: var(--accent-secondary); box-shadow: 0 0 15px rgba(255,0,85,0.4); 
        }
        #playing-title { font-weight: 800; letter-spacing: 1px; color: #fff; font-size: 1rem; text-transform: uppercase;}
        #game-frame { width: 100%; height: calc(100vh - 60px); border: none; background: #000; }

        /* ANIMATIONS */
        @keyframes fadeUp { 
            0% { opacity: 0; transform: translateY(40px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        @keyframes fadeIn { 
            0% { opacity: 0; } 
            100% { opacity: 1; } 
        }
    </style>
</head>
<body>

    <!-- LANDING MENU -->
    <div id="landing-screen">
        <div class="landing-content">
            <!-- PLACEHOLDER LOGO -->
            <img id="logo-img" class="logo-placeholder" src="script.png" alt="ScriptCade Logo" onerror="this.style.display='none'; document.getElementById('text-logo').style.display='block';">
            
            <!-- Fallback text logo if image is missing -->
            <h1 id="text-logo" style="display:none; margin: 0; font-size: 4rem; color: #00f0ff; text-transform: uppercase; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 20px rgba(0,240,255,0.5);">ScriptCade</h1>
            
            <button id="enter-btn" class="enter-btn" onclick="enterArcade()">ENTER ARCADE</button>
        </div>
    </div>

    <!-- MAIN ARCADE -->
    <div id="arcade-container">
        <h1 class="app-title">ScriptCade</h1>
        
        <!-- HOT GAMES SECTION -->
        <h2 class="section-title" style="color: var(--accent-secondary);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>
            HOT RELEASES
        </h2>
        <div class="game-grid" id="hot-grid"></div>

        <!-- ALL GAMES SECTION -->
        <h2 class="section-title" style="color: var(--accent-primary); margin-top: 50px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            ALL GAMES
        </h2>
        <div class="game-grid" id="main-grid"></div>
    </div>

    <!-- FULLSCREEN GAME VIEW -->
    <div id="fullscreen-overlay">
        <div id="game-header">
            <button id="back-btn" onclick="closeGame()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                EXIT
            </button>
            <span id="playing-title"></span>
            <div style="width: 85px;"></div> <!-- Spacer to center title properly -->
        </div>
        <iframe id="game-frame" sandbox="allow-scripts allow-pointer-lock allow-same-origin allow-forms"></iframe>
    </div>

    <script>
        // --- 1. SYSTEM FUNCTIONS ---
        
        function enterArcade() {
            const landing = document.getElementById('landing-screen');
            const arcade = document.getElementById('arcade-container');
            
            landing.style.transform = 'translateY(-40px)';
            landing.style.opacity = '0';
            
            setTimeout(() => {
                landing.style.display = 'none';
                arcade.style.display = 'block';
                loadHotGames();
                loadGames();
            }, 600);
        }

        function loadHotGames() {
            renderGrid(hotGamesList, 'hot-grid', 'hot');
        }

        function loadGames() {
            renderGrid(gamesList, 'main-grid', 'main');
        }

        function renderGrid(list, elementId, type) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            list.forEach((game, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                // Delay animation based on grid index for cascading effect
                slot.style.animationDelay = `${index * 0.1}s`;
                
                let badgeStyle = '';
                if (game.badgeText) {
                    const bg = game.badgeColor || 'var(--accent-primary)';
                    const color = getContrastYIQ(bg) === 'black' ? '#000' : '#fff';
                    badgeStyle = `background: ${bg}; color: ${color};`;
                }

                slot.innerHTML = `
                    <div class="thumbnail-area" onclick="playGame('${type}', ${index})" style="background-image: url('${game.img}')">
                        ${!game.img || game.img === 'image' ? '<span class="thumbnail-placeholder">?</span>' : ''}
                        ${game.badgeText ? `<span class="badge" style="${badgeStyle}">${game.badgeText}</span>` : ''}
                    </div>
                    <div class="slot-controls">
                        <h3 class="game-title" title="${game.title}">${game.title}</h3>
                        <button class="btn-play" onclick="playGame('${type}', ${index})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            PLAY NOW
                        </button>
                    </div>
                `;
                grid.appendChild(slot);
            });
        }

        function getContrastYIQ(hexcolor){
            if(!hexcolor) return 'black';
            if(hexcolor.startsWith('var')) return 'black'; 
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(x => x+x).join('');
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        function playGame(listType, index) {
            let data = listType === 'hot' ? hotGamesList[index] : gamesList[index];
            if (!data) return;
            
            document.getElementById('playing-title').innerText = data.title;
            const overlay = document.getElementById('fullscreen-overlay');
            const frame = document.getElementById('game-frame');
            
            overlay.style.display = 'flex';
            frame.src = data.url; 
            
            if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch((e) => {}); }
        }

        function closeGame() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
            document.getElementById('game-frame').src = ''; 
            if (document.exitFullscreen) { document.exitFullscreen().catch((e) => {}); }
        }

        // --- 2. GAME LISTS ---
        
        const hotGamesList = [
            {
                title: "Blade Ball",
                img: "bladethumb.png",
                badgeText: "HOT",
                badgeColor: "#ff0055",
                url: "https://scriptcade.github.io/blade-ball/"
            },
            {
                title: "Geometry Dash Maker",
                img: "gdthumb.jpeg",
                badgeText: "HOT",
                badgeColor: "#ff0055",
                url: "https://scriptcade.github.io/this-is-a-tesst-changing-later/"
            },
            {
                title: "Grow A Garden",
                img: "GrowAGardenthumb.avif",
                badgeText: "HOT",
                badgeColor: "#ff0055",
                url: "https://scriptcade.github.io/grow-a-garden-gemini/"
            }
        ];

        const gamesList = [
            {
                title: "Among Us Clone",
                img: "amongusthumb.webp", 
                badgeText: "FIRST PUBLISHED",
                badgeColor: "#00ff88",
                url: "https://scriptcade.github.io/among-us-gemini/" 
            },
            {
                title: "Epic Plane Evolution",
                img: "epicplanethumb.jpeg",
                url: "https://scriptcade.github.io/epic-plane-evolution/"
            },
            {
                title: "Block Blast",
                img: "blockthumb.jpeg",
                badgeText: "SAVES DATA",
                badgeColor: "#E02222",
                url: "https://scriptcade.github.io/block-blast/"
            },
            {
                title: "Tower Defense Simulator",
                img: "tdsthumb.jpeg",
                url: "https://scriptcade.github.io/tds/"
            },
            {
                title: "Block Shooter",
                img: "BLOCK SHOOTER.png",
                badgeText: "NEW",
                badgeColor: "#00f0ff",
                url: "https://scriptcade.github.io/block-shooter/"
            },
            {
                title: "Doodle Glider",
                img: "Doodleglider.png",
                badgeText: "One Prompt",
                badgeColor: "#AF2B1E",
                url: "https://relthecreator.github.io/Doodle-Glider/"
            }
        ];
    </script>
</body>
</html>
